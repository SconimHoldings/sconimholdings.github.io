# Netlify serves the site straight from the repository (the pages are already built:
# run `node tools/build.mjs` and commit before pushing). No build step on Netlify.
[build]
  publish = "."
  command = ""

# Keep the build script and its data out of the public site.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true
